<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manhwa Rose — Admin Panel</title>

<style>
body{
    margin:0;
    background:#070910;
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
}

header{
    padding:20px;
    background:#121722;
    border-bottom:1px solid #30384c;
}

.logo{
    color:#6c9aff;
    font-size:24px;
    font-weight:bold;
}

.container{
    width:90%;
    max-width:900px;
    margin:30px auto;
}

.card{
    background:#121722;
    border:1px solid #30384c;
    border-radius:18px;
    padding:25px;
    margin-bottom:20px;
}

h1{
    margin-top:0;
}

h2{
    color:#7da2ff;
}

button{
    padding:12px 18px;
    border:0;
    border-radius:10px;
    background:#5889ff;
    color:white;
    font-weight:bold;
}
</style>
</head>

<body>

<header>
    <div class="logo">🌹 MANHWA ROSE — ADMIN</div>
</header>

<div class="container">

    <div class="card">
        <h1>خوش آمدی 👑</h1>
        <p>به پنل مدیریت Manhwa Rose خوش آمدی.</p>
    </div>

    <div class="card">
        <h2>📚 مدیریت مانهوا</h2>
        <p>به‌زودی از اینجا می‌توانی مانهوا اضافه کنی.</p>
        <button>➕ افزودن مانهوا</button>
    </div>

    <div class="card">
        <h2>📕 مدیریت فصل‌ها</h2>
        <p>به‌زودی امکان افزودن فصل و صفحات را اضافه می‌کنیم.</p>
        <button>➕ افزودن فصل</button>
    </div>

</div>

</body>
     
  </html>
