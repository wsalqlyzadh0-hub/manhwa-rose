<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manhwa Rose — Admin</title>

<style>
body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#070910;
    color:white;
    font-family:Tahoma,Arial,sans-serif;
}

.box{
    width:min(90%,380px);
    padding:30px;
    background:#121722;
    border:1px solid #30384c;
    border-radius:20px;
    text-align:center;
}

h1{
    color:#6c9aff;
}

input{
    width:100%;
    padding:13px;
    margin:10px 0;
    box-sizing:border-box;
    border-radius:10px;
    border:1px solid #30384c;
    background:#080c15;
    color:white;
}

button{
    width:100%;
    padding:13px;
    margin-top:10px;
    border:0;
    border-radius:10px;
    background:#5889ff;
    color:white;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="box">

<h1>🌹 Manhwa Rose</h1>

<p>پنل مدیریت</p>

<input
type="text"
placeholder="نام کاربری"
>

<input
type="password"
placeholder="رمز عبور"
>

<button>
ورود
</button>

</div>

</body>
</html>
