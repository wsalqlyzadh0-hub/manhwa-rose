<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Manhwa Rose</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #100711;
      color: white;

      font-family: Arial, Tahoma, sans-serif;
    }

    .box {
      width: 320px;
      padding: 35px;

      text-align: center;

      border-radius: 25px;

      background: #21101d;

      box-shadow:
        0 0 50px rgba(255, 40, 100, 0.35);
    }

    .rose {
      font-size: 70px;
    }

    h1 {
      margin: 15px 0 8px;
    }

    p {
      color: #c9b7c1;
    }

    input {
      width: 100%;
      padding: 13px;

      margin-top: 10px;

      box-sizing: border-box;

      border: 1px solid #563044;
      border-radius: 10px;

      background: #120b11;
      color: white;

      outline: none;
    }

    button {
      width: 100%;
      padding: 13px;

      margin-top: 15px;

      border: 0;
      border-radius: 10px;

      background: #e34f82;
      color: white;

      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="rose">🌹</div>

    <h1>Manhwa Rose</h1>

    <p>پنل مدیریت</p>

    <input
      type="text"
      placeholder="نام کاربری"
    >

    <input
      type="password"
      placeholder="رمز عبور"
    >

    <button>
      ورود 🌹
    </button>

  </div>

</body>
</html>
