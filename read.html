<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خواندن قسمت - Manhwa Rose</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Tahoma, Arial, sans-serif;
  background: #0a0509;
  color: white;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 12px 16px;

  background: rgba(10,5,9,0.92);
  backdrop-filter: blur(10px);

  border-bottom: 1px solid rgba(255,255,255,0.1);
}

.topbar a {
  color: #ffb3c9;
  text-decoration: none;
  font-size: 13px;
}

.topbar .chapter-label {
  font-size: 14px;
  font-weight: bold;
  color: #ffd1de;
}

.settings-btn {
  background: rgba(255,255,255,0.08);

  border: 1px solid rgba(255,255,255,0.15);

  color: white;

  width: 34px;
  height: 34px;

  border-radius: 10px;

  font-size: 16px;

  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;
}

.settings-panel {
  position: fixed;

  top: 58px;
  left: 12px;

  z-index: 25;

  width: 260px;
  max-width: 80vw;

  background: rgba(20,10,17,0.97);

  border: 1px solid rgba(255,255,255,0.15);

  border-radius: 16px;

  padding: 16px;

  box-shadow: 0 20px 50px rgba(0,0,0,0.5);

  backdrop-filter: blur(14px);

  display: none;
}

.settings-panel.open {
  display: block;
}

.settings-row {
  display: flex;

  align-items: center;
  justify-content: space-between;

  margin-bottom: 14px;
}

.settings-row .label {
  font-size: 12.5px;
  color: #f0d0dc;
}

.switch {
  position: relative;

  width: 42px;
  height: 24px;

  flex-shrink: 0;
}

.switch input {
  opacity: 0;

  width: 0;
  height: 0;
}

.switch .slider-toggle {
  position: absolute;
  inset: 0;

  background: rgba(255,255,255,0.15);

  border-radius: 999px;

  cursor: pointer;

  transition: background .2s ease;
}

.switch .slider-toggle::before {
  content: "";

  position: absolute;

  width: 18px;
  height: 18px;

  left: 3px;
  top: 3px;

  background: white;

  border-radius: 50%;

  transition: transform .2s ease;
}

.switch input:checked + .slider-toggle {
  background:
    linear-gradient(
      135deg,
      #e2497a,
      #b13564
    );
}

.switch input:checked + .slider-toggle::before {
  transform: translateX(-18px);
}

.slider-block {
  margin-bottom: 14px;
}

.slider-block:last-child {
  margin-bottom: 0;
}

.slider-block .label {
  font-size: 12.5px;

  color: #f0d0dc;

  margin-bottom: 8px;

  display: flex;
  justify-content: space-between;
}

.slider-block input[type="range"] {
  width: 100%;
  accent-color: #e2497a;
}

.sub-slider {
  margin-top: 10px;

  padding-top: 10px;

  border-top:
    1px solid rgba(255,255,255,0.08);
}

/* FULLSCREEN */

.fullscreen-btn {
  width: 100%;

  display: flex;
  align-items: center;
  justify-content: center;

  gap: 8px;

  padding: 11px 12px;

  margin-top: 12px;

  border:
    1px solid rgba(255,255,255,0.12);

  border-radius: 11px;

  background:
    linear-gradient(
      135deg,
      rgba(226,73,122,.25),
      rgba(157,74,143,.25)
    );

  color: white;

  font-family: inherit;

  font-size: 12.5px;

  cursor: pointer;

  transition:
    transform .2s ease,
    background .2s ease,
    border-color .2s ease;
}

.fullscreen-btn:active {
  transform: scale(.97);
}

.pages {
  max-width: 700px;

  margin: 0 auto;

  padding-bottom: 40px;

  transition:
    max-width .2s ease;
}

.pages img {
  width: 100%;

  height: auto;

  display: block;
}

#loading,
#empty {
  text-align: center;

  padding: 60px 20px;

  color: #b98ba0;
}

#error {
  display: none;

  text-align: center;

  padding: 60px 20px;

  color: #ffb3c9;

  font-size: 14px;
}

.retry {
  margin-top: 14px;

  padding: 10px 18px;

  border: 0;

  border-radius: 12px;

  background: #d6336c;

  color: white;

  font-family: inherit;
}

.locked-box {
  display: none;

  text-align: center;

  padding: 60px 20px;
}

.locked-box .icon {
  font-size: 40px;

  margin-bottom: 10px;
}

.locked-box .title {
  font-size: 16px;

  font-weight: bold;

  color: #ffd1de;

  margin-bottom: 8px;
}

.locked-box .desc {
  font-size: 13px;

  color: #c48ea1;

  line-height: 1.9;

  margin-bottom: 16px;
}

.locked-box .subscribe-btn {
  display: inline-block;

  padding: 12px 22px;

  border-radius: 13px;

  background:
    linear-gradient(
      135deg,
      #ff347e,
      #a52cff
    );

  color: white;

  text-decoration: none;

  font-size: 13px;

  font-weight: bold;
}

.nav-bottom {
  display: flex;

  gap: 10px;

  padding: 20px 16px 40px;

  max-width: 700px;

  margin: 0 auto;
}

.nav-bottom a,
.nav-bottom span {
  flex: 1;

  text-align: center;

  padding: 14px;

  border-radius: 14px;

  background:
    linear-gradient(
      135deg,
      #9d4a8f,
      #6e2f6b
    );

  color: white;

  text-decoration: none;

  font-size: 13px;

  font-weight: bold;
}

.nav-bottom span {
  background: rgba(255,255,255,0.05);
  color: #777;
}

/* FULLSCREEN */

body.fullscreen-mode .topbar {
  display: none;
}

body.fullscreen-mode .pages {
  max-width: 100% !important;
}

body.fullscreen-mode {
  background: #000;
}

@media (max-width: 480px) {

  .settings-panel {
    width: 250px;

    max-width:
      calc(100vw - 24px);
  }

}
</style>
</head>

<body>

<div class="topbar">

  <a href="library.html">
    ← کتابخانه
  </a>

  <div
    class="chapter-label"
    id="chapterLabel"
  >
    🌹
  </div>

  <button
    class="settings-btn"
    id="settingsBtn"
    type="button"
    aria-label="تنظیمات"
  >
    ⚙️
  </button>

</div>


<!-- SETTINGS -->

<div
  class="settings-panel"
  id="settingsPanel"
>

  <div class="settings-row">

    <span class="label">
      رفتن خودکار به قسمت بعد
    </span>

    <label class="switch">

      <input
        type="checkbox"
        id="autoNextToggle"
      >

      <span class="slider-toggle"></span>

    </label>

  </div>


  <div class="settings-row">

    <span class="label">
      اسکرول خودکار
    </span>

    <label class="switch">

      <input
        type="checkbox"
        id="autoScrollToggle"
      >

      <span class="slider-toggle"></span>

    </label>

  </div>


  <div
    class="sub-slider"
    id="speedBlock"
    style="display:none;"
  >

    <div class="label">

      <span>
        سرعت اسکرول
      </span>

      <span id="speedVal">
        50
      </span>

    </div>

    <input
      type="range"
      id="speedSlider"
      min="1"
      max="100"
      value="50"
    >

  </div>


  <div class="slider-block sub-slider">

    <div class="label">

      <span>
        اندازه‌ی نمایش
      </span>

      <span id="zoomVal">
        100
      </span>

    </div>

    <input
      type="range"
      id="zoomSlider"
      min="20"
      max="100"
      value="100"
    >

  </div>


  <button
    class="fullscreen-btn"
    id="fullscreenBtn"
    type="button"
  >
    🖥️ ورود به حالت تمام‌صفحه
  </button>

</div>


<div id="loading">
  در حال بارگذاری...
</div>


<div
  id="error"
>
  <div id="errorText">
    ارتباط با سرور برقرار نشد.
  </div>

  <button
    class="retry"
    onclick="load()"
  >
    تلاش دوباره
  </button>
</div>


<div
  id="empty"
  style="display:none;"
>
  این قسمت صفحه‌ای ندارد 🌸
</div>


<div
  class="locked-box"
  id="lockedBox"
>
  <div class="icon">🔒</div>

  <div class="title">
    این قسمت قفل است
  </div>

  <div class="desc">
    برای خواندن این قسمت به اشتراک ویژهٔ Manhwa Rose نیاز داری.
    <br>
    قسمت اول هر مانهوا رایگانه.
  </div>

  <a
    class="subscribe-btn"
    href="library.html"
  >
    🌹 تهیهٔ اشتراک (به‌زودی)
  </a>
</div>


<div
  class="pages"
  id="pages"
></div>


<div
  class="nav-bottom"
  id="navBottom"
  style="display:none;"
></div>


<script>

/* =========================
   WORKER API
========================= */

const API =
  "https://manhwa-rose.wsalqlyzadh0.workers.dev";


/* =========================
   URL PARAMS
========================= */

const params =
  new URLSearchParams(
    window.location.search
  );

const chapterId =
  params.get("id");


/* =========================
   ELEMENTS
========================= */

const loading =
  document.getElementById("loading");

const emptyEl =
  document.getElementById("empty");

const errorEl =
  document.getElementById("error");

const errorText =
  document.getElementById("errorText");

const lockedBox =
  document.getElementById("lockedBox");

const pagesEl =
  document.getElementById("pages");

const navBottom =
  document.getElementById("navBottom");

const chapterLabel =
  document.getElementById("chapterLabel");

const settingsBtn =
  document.getElementById("settingsBtn");

const settingsPanel =
  document.getElementById("settingsPanel");

const autoNextToggle =
  document.getElementById("autoNextToggle");

const autoScrollToggle =
  document.getElementById("autoScrollToggle");

const speedBlock =
  document.getElementById("speedBlock");

const speedSlider =
  document.getElementById("speedSlider");

const speedVal =
  document.getElementById("speedVal");

const zoomSlider =
  document.getElementById("zoomSlider");

const zoomVal =
  document.getElementById("zoomVal");

const fullscreenBtn =
  document.getElementById("fullscreenBtn");


let nextChapterId = null;

let autoNextTriggered = false;

let scrollPaused = false;

let pauseTimeout = null;


/* =========================
   SAVED SETTINGS
========================= */

autoNextToggle.checked =
  localStorage.getItem(
    "mr_auto_next"
  ) === "1";

autoScrollToggle.checked =
  localStorage.getItem(
    "mr_auto_scroll"
  ) === "1";

speedSlider.value =
  localStorage.getItem(
    "mr_scroll_speed"
  ) || "50";

zoomSlider.value =
  localStorage.getItem(
    "mr_zoom"
  ) || "100";

speedVal.textContent =
  speedSlider.value;

zoomVal.textContent =
  zoomSlider.value;

speedBlock.style.display =
  autoScrollToggle.checked
    ? "block"
    : "none";

pagesEl.style.maxWidth =
  zoomSlider.value + "%";


/* =========================
   SETTINGS PANEL
========================= */

settingsBtn.addEventListener(
  "click",
  (e) => {

    e.stopPropagation();

    settingsPanel.classList.toggle(
      "open"
    );

  }
);


document.addEventListener(
  "click",
  (e) => {

    if (
      !settingsPanel.contains(
        e.target
      ) &&
      e.target !== settingsBtn
    ) {

      settingsPanel.classList.remove(
        "open"
      );

    }

  }
);


settingsPanel.addEventListener(
  "click",
  (e) => {

    e.stopPropagation();

  }
);


/* =========================
   AUTO NEXT
========================= */

autoNextToggle.addEventListener(
  "change",
  () => {

    localStorage.setItem(
      "mr_auto_next",

      autoNextToggle.checked
        ? "1"
        : "0"
    );

  }
);


/* =========================
   AUTO SCROLL
========================= */

autoScrollToggle.addEventListener(
  "change",
  () => {

    localStorage.setItem(
      "mr_auto_scroll",

      autoScrollToggle.checked
        ? "1"
        : "0"
    );

    speedBlock.style.display =
      autoScrollToggle.checked
        ? "block"
        : "none";

  }
);


/* =========================
   SPEED
========================= */

speedSlider.addEventListener(
  "input",
  () => {

    speedVal.textContent =
      speedSlider.value;

    localStorage.setItem(
      "mr_scroll_speed",
      speedSlider.value
    );

  }
);


/* =========================
   ZOOM
========================= */

zoomSlider.addEventListener(
  "input",
  () => {

    zoomVal.textContent =
      zoomSlider.value;

    localStorage.setItem(
      "mr_zoom",
      zoomSlider.value
    );

    pagesEl.style.maxWidth =
      zoomSlider.value + "%";

  }
);


/* =========================
   FULLSCREEN
========================= */

async function enterFullscreen() {

  try {

    if (
      document.documentElement
        .requestFullscreen
    ) {

      await document.documentElement
        .requestFullscreen();

    } else if (
      document.documentElement
        .webkitRequestFullscreen
    ) {

      document.documentElement
        .webkitRequestFullscreen();

    }

  } catch (e) {}

  document.body.classList.add(
    "fullscreen-mode"
  );

  fullscreenBtn.textContent =
    "⛶ خروج از حالت تمام‌صفحه";

  settingsPanel.classList.remove(
    "open"
  );
}


async function exitFullscreen() {

  try {

    if (
      document.exitFullscreen
    ) {

      await document.exitFullscreen();

    } else if (
      document.webkitExitFullscreen
    ) {

      document.webkitExitFullscreen();

    }

  } catch (e) {}

  document.body.classList.remove(
    "fullscreen-mode"
  );

  fullscreenBtn.textContent =
    "🖥️ ورود به حالت تمام‌صفحه";
}


fullscreenBtn.addEventListener(
  "click",
  async () => {

    const isFullscreen =
      document.fullscreenElement ||
      document.webkitFullscreenElement ||
      document.body.classList.contains(
        "fullscreen-mode"
      );

    if (isFullscreen) {

      await exitFullscreen();

    } else {

      await enterFullscreen();

    }

  }
);


function updateFullscreenButton() {

  const isFullscreen =
    document.fullscreenElement ||
    document.webkitFullscreenElement;

  if (isFullscreen) {

    document.body.classList.add(
      "fullscreen-mode"
    );

    fullscreenBtn.textContent =
      "⛶ خروج از حالت تمام‌صفحه";

  } else {

    document.body.classList.remove(
      "fullscreen-mode"
    );

    fullscreenBtn.textContent =
      "🖥️ ورود به حالت تمام‌صفحه";

  }
}


document.addEventListener(
  "fullscreenchange",
  updateFullscreenButton
);

document.addEventListener(
  "webkitfullscreenchange",
  updateFullscreenButton
);


/* =========================
   AUTO SCROLL
========================= */

function autoScrollTick() {

  if (
    autoScrollToggle.checked &&
    !scrollPaused
  ) {

    const speed =
      Number(
        speedSlider.value
      );

    const pxPerFrame =
      0.15 +
      (speed / 100) * 4.5;

    window.scrollBy(
      0,
      pxPerFrame
    );


    const nearBottom =
      window.innerHeight +
      window.scrollY >=
      document.body.scrollHeight - 40;


    if (
      nearBottom &&
      autoNextToggle.checked &&
      nextChapterId &&
      !autoNextTriggered
    ) {

      autoNextTriggered = true;

      window.location.href =
        "read.html?id=" +
        encodeURIComponent(
          nextChapterId
        );

    }

  }

  requestAnimationFrame(
    autoScrollTick
  );
}


requestAnimationFrame(
  autoScrollTick
);


/* =========================
   TOUCH PAUSE
========================= */

document.addEventListener(
  "touchstart",
  () => {

    scrollPaused = true;

    clearTimeout(
      pauseTimeout
    );

  },
  {
    passive: true
  }
);


document.addEventListener(
  "touchend",
  () => {

    clearTimeout(
      pauseTimeout
    );

    pauseTimeout =
      setTimeout(
        () => {

          scrollPaused = false;

        },
        900
      );

  },
  {
    passive: true
  }
);


/* =========================
   MANUAL SCROLL
========================= */

window.addEventListener(
  "scroll",
  () => {

    const nearBottom =
      window.innerHeight +
      window.scrollY >=
      document.body.scrollHeight - 40;


    if (
      nearBottom &&
      autoNextToggle.checked &&
      nextChapterId &&
      !autoNextTriggered
    ) {

      autoNextTriggered = true;

      window.location.href =
        "read.html?id=" +
        encodeURIComponent(
          nextChapterId
        );

    }

  },
  {
    passive: true
  }
);


/* =========================
   LOAD CHAPTER
========================= */

async function load() {

  if (!chapterId) {

    loading.style.display =
      "none";

    errorText.textContent =
      "قسمت مشخص نشده.";

    errorEl.style.display =
      "block";

    return;
  }


  loading.style.display =
    "block";

  errorEl.style.display =
    "none";

  emptyEl.style.display =
    "none";

  lockedBox.style.display =
    "none";

  pagesEl.innerHTML =
    "";

  navBottom.style.display =
    "none";


  try {

    const res =
      await fetch(
        API +
        "/api/public/chapters/" +
        encodeURIComponent(
          chapterId
        ),
        {
          method: "GET",

          headers: {
            "Accept":
              "application/json"
          },

          credentials:
            "include",

          cache: "no-store"
        }
      );


    if (!res.ok) {

      throw new Error(
        "HTTP " + res.status
      );
    }


    const data =
      await res.json();


    if (!data.success) {

      loading.style.display =
        "none";

      errorText.textContent =
        data.message ||
        data.error ||
        "قسمت پیدا نشد.";

      errorEl.style.display =
        "block";

      return;
    }


    loading.style.display =
      "none";


    const ch =
      data.chapter;


    chapterLabel.textContent =
      `قسمت ${ch.chapter_number}`;


    /* =========================
       CHAPTER NAVIGATION
    ========================= */

    const siblings =
      Array.isArray(
        data.siblings
      )
        ? data.siblings
        : [];


    const idx =
      siblings.findIndex(
        s =>
          String(s.id) ===
          String(ch.id)
      );


    const prev =
      idx > 0
        ? siblings[idx - 1]
        : null;


    const next =
      idx >= 0 &&
      idx < siblings.length - 1
        ? siblings[idx + 1]
        : null;


    nextChapterId =
      next
        ? next.id
        : null;


    navBottom.style.display =
      "flex";


    navBottom.innerHTML = `

      ${
        next
          ? `
            <a
              href="read.html?id=${encodeURIComponent(next.id)}"
            >
              ▶ قسمت بعد
            </a>
          `
          : `
            <span>
              آخرین قسمت
            </span>
          `
      }

      ${
        prev
          ? `
            <a
              href="read.html?id=${encodeURIComponent(prev.id)}"
            >
              قسمت قبل ◀
            </a>
          `
          : `
            <span>
              اولین قسمت
            </span>
          `
      }

    `;


    /* =========================
       LOCKED CHAPTER
    ========================= */

    if (data.locked) {

      lockedBox.style.display =
        "block";

      return;
    }


    const pages =
      Array.isArray(ch.pages)
        ? ch.pages
        : [];


    if (pages.length === 0) {

      emptyEl.style.display =
        "block";

    } else {

      pages.forEach(
        (src) => {

          if (!src) return;

          const img =
            document.createElement(
              "img"
            );

          img.src =
            src;

          img.loading =
            "lazy";

          img.decoding =
            "async";

          img.alt =
            `قسمت ${ch.chapter_number}`;

          pagesEl.appendChild(
            img
          );

        }
      );

    }


  } catch (err) {

    console.error(
      "Chapter API error:",
      err
    );


    loading.style.display =
      "none";

    errorText.textContent =
      "ارتباط با سرور برقرار نشد.";

    errorEl.style.display =
      "block";

  }

}


/* =========================
   START
========================= */

load();

</script>

</body>
     </html>
