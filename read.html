<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>خواندن قسمت - Manhwa Rose</title>

<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html {
    scroll-behavior: smooth;
    background: #0a0509;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: Tahoma, Arial, sans-serif;
    background: #0a0509;
    color: white;
    overflow-x: hidden;
  }

  button, input {
    font-family: inherit;
  }

  @keyframes gearOpen {
    0% { transform: rotate(0deg) scale(1); }
    50% { transform: rotate(100deg) scale(1.15); }
    100% { transform: rotate(180deg) scale(1); }
  }

  @keyframes gearClose {
    0% { transform: rotate(180deg) scale(1); }
    100% { transform: rotate(0deg) scale(1); }
  }

  @keyframes toggleOn {
    0% { transform: scale(.85); }
    60% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes buttonShine {
    0% { transform: translateX(-130%); }
    100% { transform: translateX(130%); }
  }

  @keyframes ripple {
    from { width: 0; height: 0; opacity: .5; }
    to { width: 420px; height: 420px; opacity: 0; }
  }

  /* ---------- TOP BAR ---------- */

  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 58px;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)) 16px;
    background: rgba(10,5,9,.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,.1);
    transition: background .3s ease, box-shadow .3s ease, transform .35s cubic-bezier(.2,.8,.2,1), opacity .35s ease;
  }

  .topbar a {
    color: #ffb3c9;
    text-decoration: none;
    font-size: 13px;
    transition: color .25s ease, transform .25s ease;
  }

  .topbar a:hover {
    color: #ffd1de;
    transform: translateX(3px);
  }

  .chapter-label {
    font-size: 14px;
    font-weight: bold;
    color: #ffd1de;
  }

  /* ---------- SETTINGS BUTTON ---------- */

  .settings-btn {
    position: relative;
    background: linear-gradient(145deg, rgba(255,255,255,.1), rgba(255,255,255,.05));
    border: 1px solid rgba(255,255,255,.15);
    color: white;
    width: 38px;
    height: 38px;
    border-radius: 12px;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    box-shadow: 0 5px 18px rgba(0,0,0,.2);
    transition: transform .25s cubic-bezier(.2,.8,.2,1), background .25s ease, border-color .25s ease, box-shadow .25s ease;
  }

  .settings-btn:hover {
    transform: translateY(-2px) scale(1.04);
    background: linear-gradient(145deg, rgba(226,73,122,.2), rgba(255,255,255,.07));
    border-color: rgba(255,143,174,.35);
    box-shadow: 0 8px 25px rgba(226,73,122,.15);
  }

  .settings-btn:active { transform: scale(.9); transition-duration: .08s; }

  .settings-btn.active {
    background: linear-gradient(135deg, rgba(226,73,122,.35), rgba(177,53,100,.25));
    border-color: rgba(255,143,174,.45);
    box-shadow: 0 0 25px rgba(226,73,122,.18);
  }

  .settings-btn.active .gear { animation: gearOpen .45s cubic-bezier(.2,.8,.2,1); }
  .settings-btn:not(.active) .gear { animation: gearClose .25s ease; }

  /* ---------- SETTINGS PANEL ---------- */

  .settings-panel {
    position: fixed;
    top: 68px;
    left: 12px;
    z-index: 25;
    width: 280px;
    max-width: calc(100vw - 24px);
    background: linear-gradient(145deg, rgba(29,13,23,.98), rgba(16,8,14,.98));
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 18px;
    padding: 17px;
    box-shadow: 0 25px 70px rgba(0,0,0,.55), 0 0 35px rgba(226,73,122,.08);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-12px) scale(.94);
    pointer-events: none;
    transition: opacity .22s ease, transform .28s cubic-bezier(.2,.8,.2,1), visibility .22s ease;
  }

  .settings-panel.open {
    opacity: 1;
    visibility: visible;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }

  .settings-panel::before {
    content: "";
    position: absolute;
    top: -7px;
    left: 17px;
    width: 13px;
    height: 13px;
    background: #1d0d17;
    border-left: 1px solid rgba(255,255,255,.14);
    border-top: 1px solid rgba(255,255,255,.14);
    transform: rotate(45deg);
  }

  .settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 15px;
  }

  .settings-row .label {
    font-size: 12.5px;
    color: #f0d0dc;
    line-height: 1.6;
  }

  /* ---------- SWITCH ---------- */

  .switch { position: relative; width: 46px; height: 26px; flex-shrink: 0; }
  .switch input { position: absolute; opacity: 0; width: 0; height: 0; }

  .slider-toggle {
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,.13);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 999px;
    cursor: pointer;
    box-shadow: inset 0 1px 3px rgba(0,0,0,.2);
    transition: background .3s ease, box-shadow .3s ease;
  }

  .slider-toggle::before {
    content: "";
    position: absolute;
    width: 20px;
    height: 20px;
    left: 2px;
    top: 2px;
    background: linear-gradient(145deg, #fff, #eee);
    border-radius: 50%;
    box-shadow: 0 2px 6px rgba(0,0,0,.25);
    transition: transform .32s cubic-bezier(.2,.8,.2,1), box-shadow .3s ease;
  }

  .switch input:checked + .slider-toggle {
    background: linear-gradient(135deg, #e2497a, #b13564);
    box-shadow: 0 0 14px rgba(226,73,122,.28);
  }

  .switch input:checked + .slider-toggle::before {
    transform: translateX(-20px);
    box-shadow: 0 2px 8px rgba(226,73,122,.25);
    animation: toggleOn .28s ease;
  }

  /* ---------- SLIDERS ---------- */

  .slider-block { margin-bottom: 14px; }
  .slider-block:last-child { margin-bottom: 0; }

  .slider-block .label {
    font-size: 12.5px;
    color: #f0d0dc;
    margin-bottom: 9px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .slider-block .label span:last-child {
    color: #ff8fae;
    font-weight: bold;
    min-width: 28px;
    text-align: left;
  }

  .slider-block input[type="range"] {
    width: 100%;
    height: 5px;
    appearance: none;
    -webkit-appearance: none;
    background: linear-gradient(90deg, #e2497a, #b13564);
    border-radius: 999px;
    outline: none;
    cursor: pointer;
  }

  .slider-block input[type="range"]::-webkit-slider-thumb {
    appearance: none;
    -webkit-appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #e2497a;
    border: 3px solid #ffd1de;
    box-shadow: 0 3px 12px rgba(226,73,122,.4);
    transition: transform .2s ease, box-shadow .2s ease;
  }

  .slider-block input[type="range"]::-webkit-slider-thumb:hover {
    transform: scale(1.15);
    box-shadow: 0 4px 18px rgba(226,73,122,.55);
  }

  .slider-block input[type="range"]::-moz-range-thumb {
    width: 17px;
    height: 17px;
    border-radius: 50%;
    background: #e2497a;
    border: 3px solid #ffd1de;
    box-shadow: 0 3px 12px rgba(226,73,122,.4);
  }

  .sub-slider {
    margin-top: 10px;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,.08);
    animation: fadeIn .25s ease;
  }

  /* ---------- FULLSCREEN BUTTON ---------- */

  .fullscreen-option {
    margin-top: 4px;
    padding-top: 14px;
    border-top: 1px solid rgba(255,255,255,.08);
  }

  .fullscreen-btn {
    width: 100%;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 12px;
    padding: 11px 13px;
    background: linear-gradient(135deg, rgba(226,73,122,.15), rgba(157,74,143,.12));
    color: #f8d9e3;
    font-size: 12.5px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    overflow: hidden;
    position: relative;
    transition: transform .25s cubic-bezier(.2,.8,.2,1), background .25s ease, border-color .25s ease, box-shadow .25s ease;
  }

  .fullscreen-btn::before {
    content: "";
    position: absolute;
    top: 0; bottom: 0;
    width: 45%;
    left: -70%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.13), transparent);
    transform: skewX(-20deg);
  }

  .fullscreen-btn:hover::before { animation: buttonShine .65s ease; }

  .fullscreen-btn:hover {
    transform: translateY(-2px);
    background: linear-gradient(135deg, rgba(226,73,122,.25), rgba(157,74,143,.2));
    border-color: rgba(255,143,174,.3);
    box-shadow: 0 7px 20px rgba(226,73,122,.12);
  }

  .fullscreen-btn:active { transform: scale(.96); transition-duration: .08s; }

  .fullscreen-btn.active {
    background: linear-gradient(135deg, rgba(226,73,122,.4), rgba(157,74,143,.3));
    border-color: rgba(255,143,174,.5);
  }

  .fullscreen-icon { font-size: 18px; transition: transform .3s ease; }
  .fullscreen-btn:hover .fullscreen-icon { transform: scale(1.15); }

  /* ---------- PAGES ---------- */

  .pages {
    max-width: 700px;
    margin: 0 auto;
    padding-bottom: 40px;
    transition: max-width .35s cubic-bezier(.2,.8,.2,1);
  }

  .pages img {
    width: 100%;
    display: block;
    opacity: 0;
    animation: fadeIn .45s ease forwards;
  }

  #loading, #empty {
    text-align: center;
    padding: 60px 20px;
    color: #b98ba0;
    animation: fadeIn .4s ease;
  }

  /* ---------- BOTTOM NAV ---------- */

  .nav-bottom {
    display: flex;
    gap: 10px;
    padding: 20px 16px calc(40px + env(safe-area-inset-bottom, 0px));
    max-width: 700px;
    margin: 0 auto;
  }

  .nav-bottom a, .nav-bottom span {
    flex: 1;
    text-align: center;
    padding: 14px;
    border-radius: 14px;
    background: linear-gradient(135deg, #9d4a8f, #6e2f6b);
    color: white;
    text-decoration: none;
    font-size: 13px;
    font-weight: bold;
    border: 1px solid rgba(255,255,255,.1);
    position: relative;
    overflow: hidden;
    transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s ease, filter .25s ease;
  }

  .nav-bottom a:hover {
    transform: translateY(-3px);
    box-shadow: 0 9px 25px rgba(157,74,143,.25);
    filter: brightness(1.1);
  }

  .nav-bottom a:active { transform: scale(.96); transition-duration: .08s; }

  .nav-bottom span {
    background: rgba(255,255,255,.05);
    color: #777;
    border-color: rgba(255,255,255,.06);
  }

  /* ---------- RIPPLE ---------- */

  .ripple {
    position: absolute;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    background: rgba(255,255,255,.3);
    pointer-events: none;
    width: 0; height: 0;
    animation: ripple .65s ease-out forwards;
    z-index: 20;
  }

  /* ---------- FULLSCREEN MODE ---------- */

  body.fullscreen-mode { background: #000; }

  body.fullscreen-mode .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    transform: translateY(-100%);
    opacity: 0;
  }

  body.fullscreen-mode .topbar.peek {
    transform: translateY(0);
    opacity: 1;
  }

  body.fullscreen-mode .pages { max-width: 100% !important; padding-top: 20px; }

  @media (max-width: 480px) {
    .topbar { padding-left: 12px; padding-right: 12px; }
    .settings-panel { top: 67px; left: 10px; width: 285px; max-width: calc(100vw - 20px); }
    .nav-bottom { gap: 8px; padding-left: 12px; padding-right: 12px; }
    .nav-bottom a, .nav-bottom span { padding: 13px 8px; font-size: 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body>

  <div class="topbar" id="topbar">
    <a href="/index.html">← کتابخانه</a>
    <div class="chapter-label" id="chapterLabel">🌹</div>
    <button class="settings-btn" id="settingsBtn" type="button" aria-label="تنظیمات" aria-expanded="false">
      <span class="gear">⚙️</span>
    </button>
  </div>

  <div class="settings-panel" id="settingsPanel">

    <div class="settings-row">
      <span class="label">رفتن خودکار به قسمت بعد</span>
      <label class="switch">
        <input type="checkbox" id="autoNextToggle">
        <span class="slider-toggle"></span>
      </label>
    </div>

    <div class="settings-row">
      <span class="label">اسکرول خودکار</span>
      <label class="switch">
        <input type="checkbox" id="autoScrollToggle">
        <span class="slider-toggle"></span>
      </label>
    </div>

    <div class="sub-slider" id="speedBlock" style="display:none;">
      <div class="label"><span>سرعت اسکرول</span><span id="speedVal">50</span></div>
      <input type="range" id="speedSlider" min="1" max="100" value="50">
    </div>

    <div class="slider-block sub-slider">
      <div class="label"><span>اندازه‌ی نمایش</span><span id="zoomVal">100</span></div>
      <input type="range" id="zoomSlider" min="20" max="100" value="100">
    </div>

    <div class="fullscreen-option">
      <button class="fullscreen-btn" id="fullscreenBtn" type="button">
        <span>تمام صفحه</span>
        <span class="fullscreen-icon" id="fullscreenIcon">⛶</span>
      </button>
    </div>

  </div>

  <div id="loading">در حال بارگذاری...</div>
  <div id="empty" style="display:none;">این قسمت صفحه‌ای ندارد 🌸</div>

  <div class="pages" id="pages"></div>

  <div class="nav-bottom" id="navBottom" style="display:none;"></div>

<script>
  const params = new URLSearchParams(window.location.search);
  const chapterId = params.get("id");

  const loading = document.getElementById("loading");
  const emptyEl = document.getElementById("empty");
  const pagesEl = document.getElementById("pages");
  const navBottom = document.getElementById("navBottom");
  const chapterLabel = document.getElementById("chapterLabel");
  const topbar = document.getElementById("topbar");

  const settingsBtn = document.getElementById("settingsBtn");
  const settingsPanel = document.getElementById("settingsPanel");
  const autoNextToggle = document.getElementById("autoNextToggle");
  const autoScrollToggle = document.getElementById("autoScrollToggle");
  const speedBlock = document.getElementById("speedBlock");
  const speedSlider = document.getElementById("speedSlider");
  const speedVal = document.getElementById("speedVal");
  const zoomSlider = document.getElementById("zoomSlider");
  const zoomVal = document.getElementById("zoomVal");
  const fullscreenBtn = document.getElementById("fullscreenBtn");
  const fullscreenIcon = document.getElementById("fullscreenIcon");

  let nextChapterId = null;
  let autoNextTriggered = false;

  /* ---------- load saved settings ---------- */
  autoNextToggle.checked = localStorage.getItem("mr_auto_next") === "1";
  autoScrollToggle.checked = localStorage.getItem("mr_auto_scroll") === "1";
  speedSlider.value = localStorage.getItem("mr_scroll_speed") || "50";
  zoomSlider.value = localStorage.getItem("mr_zoom") || "100";
  speedVal.textContent = speedSlider.value;
  zoomVal.textContent = zoomSlider.value;
  speedBlock.style.display = autoScrollToggle.checked ? "block" : "none";
  pagesEl.style.maxWidth = zoomSlider.value + "%";

  /* ---------- settings panel toggle ---------- */
  function openSettings() {
    settingsPanel.classList.add("open");
    settingsBtn.classList.add("active");
    settingsBtn.setAttribute("aria-expanded", "true");
  }

  function closeSettings() {
    settingsPanel.classList.remove("open");
    settingsBtn.classList.remove("active");
    settingsBtn.setAttribute("aria-expanded", "false");
  }

  settingsBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    if (settingsPanel.classList.contains("open")) {
      closeSettings();
    } else {
      openSettings();
    }
  });

  document.addEventListener("click", (e) => {
    if (!settingsPanel.contains(e.target) && e.target !== settingsBtn && !settingsBtn.contains(e.target)) {
      closeSettings();
    }
  });

  settingsPanel.addEventListener("click", (e) => e.stopPropagation());

  /* ---------- toggles ---------- */
  autoNextToggle.addEventListener("change", () => {
    localStorage.setItem("mr_auto_next", autoNextToggle.checked ? "1" : "0");
  });

  autoScrollToggle.addEventListener("change", () => {
    localStorage.setItem("mr_auto_scroll", autoScrollToggle.checked ? "1" : "0");
    speedBlock.style.display = autoScrollToggle.checked ? "block" : "none";
  });

  speedSlider.addEventListener("input", () => {
    speedVal.textContent = speedSlider.value;
    localStorage.setItem("mr_scroll_speed", speedSlider.value);
  });

  zoomSlider.addEventListener("input", () => {
    zoomVal.textContent = zoomSlider.value;
    localStorage.setItem("mr_zoom", zoomSlider.value);
    pagesEl.style.maxWidth = zoomSlider.value + "%";
  });

  /* ---------- fullscreen ---------- */
  fullscreenBtn.addEventListener("click", () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen?.().catch(() => {});
      document.body.classList.add("fullscreen-mode");
      fullscreenBtn.classList.add("active");
      fullscreenIcon.textContent = "⛶";
    } else {
      document.exitFullscreen?.().catch(() => {});
      document.body.classList.remove("fullscreen-mode");
      fullscreenBtn.classList.remove("active");
    }
    closeSettings();
  });

  document.addEventListener("fullscreenchange", () => {
    if (!document.fullscreenElement) {
      document.body.classList.remove("fullscreen-mode");
      fullscreenBtn.classList.remove("active");
    }
  });

  document.addEventListener("click", (e) => {
    if (document.body.classList.contains("fullscreen-mode") && e.clientY < 70) {
      topbar.classList.add("peek");
      clearTimeout(window._peekTimeout);
      window._peekTimeout = setTimeout(() => topbar.classList.remove("peek"), 2500);
    }
  });

  /* ---------- auto scroll loop ---------- */
  let scrollPaused = false;
  let pauseTimeout = null;

  function autoScrollTick() {
    if (autoScrollToggle.checked && !scrollPaused) {
      const speed = Number(speedSlider.value);
      const pxPerFrame = 0.15 + (speed / 100) * 4.5;
      window.scrollBy(0, pxPerFrame);

      const nearBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 40;

      if (nearBottom && autoNextToggle.checked && nextChapterId && !autoNextTriggered) {
        autoNextTriggered = true;
        window.location.href = `/read.html?id=${nextChapterId}`;
      }
    }
    requestAnimationFrame(autoScrollTick);
  }
  requestAnimationFrame(autoScrollTick);

  document.addEventListener("touchstart", () => {
    scrollPaused = true;
    clearTimeout(pauseTimeout);
  }, { passive: true });

  document.addEventListener("touchend", () => {
    clearTimeout(pauseTimeout);
    pauseTimeout = setTimeout(() => { scrollPaused = false; }, 900);
  }, { passive: true });

  window.addEventListener("scroll", () => {
    const nearBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 40;
    if (nearBottom && autoNextToggle.checked && nextChapterId && !autoNextTriggered) {
      autoNextTriggered = true;
      window.location.href = `/read.html?id=${nextChapterId}`;
    }
  }, { passive: true });

  /* ---------- ripple effect ---------- */
  document.addEventListener("click", (e) => {
    const target = e.target.closest(".settings-btn, .fullscreen-btn, .nav-bottom a");
    if (!target) return;

    const rect = target.getBoundingClientRect();
    const ripple = document.createElement("span");
    ripple.className = "ripple";
    ripple.style.left = (e.clientX - rect.left) + "px";
    ripple.style.top = (e.clientY - rect.top) + "px";
    target.style.position = "relative";
