<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manhwa Rose</title>
<style>
  * { box-sizing: border-box; }

  @keyframes petal-fall {
    0% { transform: translateY(-10vh) rotate(0deg); opacity: 0.9; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0px) rotate(-3deg); }
    50% { transform: translateY(-8px) rotate(3deg); }
  }

  body {
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;
    font-family: Tahoma, Arial, sans-serif;
    background: radial-gradient(circle at top, #6b1f42, #1a0a17 45%, #08050a);
    color: white;
    position: relative;
  }

  .petal {
    position: fixed;
    top: -10vh;
    font-size: 18px;
    animation: petal-fall linear infinite;
    pointer-events: none;
    opacity: 0.6;
    z-index: 0;
  }

  .wrap { max-width: 520px; margin: 0 auto; padding: 20px 16px 60px; position: relative; z-index: 1; }

  header {
    text-align: center;
    margin-bottom: 22px;
  }

  header .rose { font-size: 40px; display: inline-block; animation: float 4s ease-in-out infinite; }

  header h1 {
    font-size: 26px;
    margin: 6px 0 4px;
    background: linear-gradient(90deg, #ffd1de, #ff8fae, #ffd1de);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  header p { color: #d8c3cd; font-size: 13px; margin: 0; }

  .search {
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.07);
    color: white;
    font-size: 14px;
    margin: 18px 0 22px;
    outline: none;
  }

  .search:focus { border-color: #e65382; }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 18px;
    overflow: hidden;
    text-decoration: none;
    color: white;
    display: block;
    transition: transform .18s ease;
  }

  .card:active { transform: scale(.97); }

  .card .cover {
    width: 100%;
    aspect-ratio: 3/4;
    background: linear-gradient(135deg, #4a2040, #2a1428);
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
  }

  .card .info { padding: 10px 12px 14px; }
  .card .title { font-weight: bold; font-size: 14px; margin-bottom: 4px; line-height: 1.3; }
  .card .meta {
    font-size: 11px;
    color: #e8b8c8;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .status-badge {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(226,73,122,0.25);
    border: 1px solid rgba(226,73,122,0.4);
  }

  #empty {
    text-align: center;
    color: #b98ba0;
    padding: 60px 20px;
    font-size: 14px;
  }

  #loading { text-align: center; padding: 40px; color: #d8a8bb; }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <div class="rose">🌹</div>
    <h1>Manhwa Rose</h1>
    <p>دنیای مانهوا در دستان تو</p>
  </header>

  <input class="search" id="search" placeholder="🔍 جستجوی مانهوا...">

  <div id="loading">در حال بارگذاری...</div>
  <div class="grid" id="grid"></div>
  <div id="empty" style="display:none;">هنوز مانهوایی اضافه نشده 🌸</div>

</div>

<script>
  const petals = ["🌸","🌹","🥀","💮"];
  for (let i = 0; i < 10; i++) {
    const el = document.createElement("div");
    el.className = "petal";
    el.textContent = petals[Math.floor(Math.random() * petals.length)];
    el.style.left = Math.random() * 100 + "vw";
    el.style.animationDuration = (10 + Math.random() * 12) + "s";
    el.style.animationDelay = (Math.random() * 10) + "s";
    el.style.fontSize = (12 + Math.random() * 12) + "px";
    document.body.appendChild(el);
  }

  const grid = document.getElementById("grid");
  const empty = document.getElementById("empty");
  const loading = document.getElementById("loading");
  const searchInput = document.getElementById("search");

  let allManga = [];

  function statusLabel(s) {
    return s === "completed" ? "تمام‌شده" : "در حال انتشار";
  }

  function render(list) {
    grid.innerHTML = "";

    if (list.length === 0) {
      empty.style.display = "block";
      return;
    }
    empty.style.display = "none";

    list.forEach(m => {
      const a = document.createElement("a");
      a.className = "card";
      a.href = `/view.html?id=${m.id}`;

      const coverStyle = m.cover_url
        ? `background-image: url('${m.cover_url}')`
        : "";

      a.innerHTML = `
        <div class="cover" style="${coverStyle}">${m.cover_url ? "" : "📖"}</div>
        <div class="info">
          <div class="title">${m.title}</div>
          <div class="meta">
            <span>${m.genre || ""}</span>
            <span class="status-badge">${statusLabel(m.status)}</span>
          </div>
        </div>
      `;
      grid.appendChild(a);
    });
  }

  async function load() {
    try {
      const res = await fetch("/api/public/manga");
      const data = await res.json();
      loading.style.display = "none";

      if (data.success) {
        allManga = data.manga;
        render(allManga);
      } else {
        empty.textContent = "خطا در بارگذاری.";
        empty.style.display = "block";
      }
    } catch {
      loading.style.display = "none";
      empty.textContent = "ارتباط با سرور برقرار نشد.";
      empty.style.display = "block";
    }
  }

  searchInput.addEventListener("input", () => {
    const q = searchInput.value.trim().toLowerCase();
    const filtered = allManga.filter(m => m.title.toLowerCase().includes(q));
    render(filtered);
  });

  load();
</script>

</body>
</html>
