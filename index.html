<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manhwa Rose</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  @keyframes petal-fall {
    0% { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 0.9; }
    50% { transform: translateY(50vh) translateX(20px) rotate(180deg); }
    100% { transform: translateY(110vh) translateX(-10px) rotate(360deg); opacity: 0; }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0px) rotate(-4deg) scale(1); }
    50% { transform: translateY(-12px) rotate(4deg) scale(1.05); }
  }

  @keyframes glow {
    0%, 100% { text-shadow: 0 0 20px rgba(233,90,140,0.6), 0 0 40px rgba(233,90,140,0.3); }
    50% { text-shadow: 0 0 35px rgba(233,90,140,0.95), 0 0 65px rgba(233,90,140,0.55); }
  }

  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }

  @keyframes pop-in {
    0% { transform: translateY(16px) scale(0.94); opacity: 0; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }

  body {
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;
    font-family: Tahoma, Arial, sans-serif;
    background:
      radial-gradient(circle at 20% 0%, rgba(233,90,140,0.25), transparent 45%),
      radial-gradient(circle at 100% 30%, rgba(157,74,143,0.25), transparent 45%),
      radial-gradient(circle at top, #6b1f42, #1a0a17 45%, #08050a);
    color: white;
    position: relative;
  }

  .petal {
    position: fixed;
    top: -10vh;
    font-size: 18px;
    animation: petal-fall linear infinite;
    pointer-events: none;
    opacity: 0.6;
    z-index: 0;
  }

  .wrap { max-width: 520px; margin: 0 auto; padding: 30px 18px 60px; position: relative; z-index: 1; }

  header { text-align: center; margin-bottom: 30px; }

  .mascot {
    font-size: 50px;
    display: inline-block;
    animation: float 4s ease-in-out infinite;
    filter: drop-shadow(0 8px 16px rgba(233,90,140,0.4));
  }

  header h1 {
    font-size: 30px;
    margin: 10px 0 4px;
    font-weight: 900;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #ffd1de, #ff8fae, #f9c6d8, #ffd1de);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 5s linear infinite, glow 3s ease-in-out infinite;
  }

  header p { color: #dcc2cf; font-size: 13px; margin: 2px 0 0; opacity: 0.9; }

  .categories {
    display: flex;
    flex-direction: column;
    gap: 18px;
    margin-top: 30px;
  }

  .cat-card {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 22px;
    border-radius: 22px;
    text-decoration: none;
    color: white;
    position: relative;
    overflow: hidden;
    animation: pop-in 0.5s ease backwards;
    transition: transform .2s cubic-bezier(.2,.8,.2,1);
    border: 1px solid rgba(255,255,255,0.15);
  }

  .cat-card:active { transform: scale(.97); }

  .cat-card::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.2) 50%, transparent 70%);
    transform: translateX(-120%);
    transition: transform .6s ease;
  }
  .cat-card:active::after { transform: translateX(120%); }

  .cat-action {
    background: linear-gradient(135deg, #1a3a6b, #0d2140);
    animation-delay: 0s;
  }

  .cat-romance {
    background: linear-gradient(135deg, #7a5a10, #4a3608);
    animation-delay: 0.1s;
  }

  .cat-all {
    background: linear-gradient(135deg, #7a2050, #4a1230);
    animation-delay: 0.2s;
  }

  .cat-rose {
    font-size: 44px;
    flex-shrink: 0;
  }

  .cat-rose.blue { filter: hue-rotate(150deg) saturate(2.2); }
  .cat-rose.yellow { filter: hue-rotate(-65deg) saturate(2); }

  .cat-info h2 { margin: 0 0 4px; font-size: 19px; }
  .cat-info p { margin: 0; font-size: 12.5px; opacity: 0.8; }

  .cat-arrow {
    margin-right: auto;
    font-size: 18px;
    opacity: 0.6;
  }

  footer {
    text-align: center;
    margin-top: 40px;
    font-size: 11px;
    color: #8a6272;
  }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <div class="mascot">🌹</div>
    <h1>MANHWA ROSE</h1>
    <p>یک دسته رو انتخاب کن و شروع کن ✨</p>
  </header>

  <div class="categories">

    <a href="/library.html?genre=اکشن" class="cat-card cat-action">
      <div class="cat-rose blue">🌹</div>
      <div class="cat-info">
        <h2>رز آبی</h2>
        <p>اکشن</p>
      </div>
      <div class="cat-arrow">◀</div>
    </a>

    <a href="/library.html?genre=عاشقانه" class="cat-card cat-romance">
      <div class="cat-rose yellow">🌹</div>
      <div class="cat-info">
        <h2>رز زرد</h2>
        <p>عاشقانه</p>
      </div>
      <div class="cat-arrow">◀</div>
    </a>

    <a href="/library.html" class="cat-card cat-all">
      <div class="cat-rose">🌹</div>
      <div class="cat-info">
        <h2>همه</h2>
        <p>مشاهده‌ی کل کتابخانه</p>
      </div>
      <div class="cat-arrow">◀</div>
    </a>

  </div>

  <footer>Manhwa Rose · ساخته‌شده با عشق 🌹</footer>

</div>

<script>
  const petals = ["🌸","🌹","🥀","💮","🌺"];
  for (let i = 0; i < 10; i++) {
    const el = document.createElement("div");
    el.className = "petal";
    el.textContent = petals[Math.floor(Math.random() * petals.length)];
    el.style.left = Math.random() * 100 + "vw";
    el.style.animationDuration = (9 + Math.random() * 12) + "s";
    el.style.animationDelay = (Math.random() * 10) + "s";
    el.style.fontSize = (12 + Math.random() * 14) + "px";
    document.body.appendChild(el);
  }
</script>

</body>
</html>
