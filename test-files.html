<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فایل‌های تست - Manhwa Rose</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: Tahoma, Arial, sans-serif;
    background: radial-gradient(circle at top, #6b1f42, #1a0a17 45%, #08050a);
    color: white;
    padding: 20px 14px 60px;
  }

  .wrap { max-width: 480px; margin: 0 auto; }

  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .topbar a { color: #ffb3c9; text-decoration: none; font-size: 14px; }

  h1 {
    font-size: 22px;
    text-align: center;
    margin: 0 0 20px;
    background: linear-gradient(90deg, #ffd1de, #ff8fae, #ffd1de);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .card {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.13);
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 16px;
  }

  .card h2 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }

  input {
    width: 100%;
    padding: 12px;
    margin-bottom: 10px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(0,0,0,0.3);
    color: white;
    font-size: 13px;
    direction: ltr;
    text-align: left;
  }

  button {
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    font-weight: bold;
    cursor: pointer;
    font-size: 13px;
    color: white;
    background: linear-gradient(135deg, #9d4a8f, #6e2f6b);
  }

  #message { text-align: center; min-height: 20px; margin-bottom: 10px; color: #ff8fae; font-size: 13px; }
</style>
</head>
<body>

<div class="wrap">

  <div class="topbar">
    <a href="/admin.html">← بازگشت به پنل</a>
    <span>🌹</span>
  </div>

  <h1>📝 فایل‌های تست</h1>
  <div id="message"></div>

  <div class="card">
    <h2>🌍 تست ترجمه</h2>
    <input id="translate" placeholder="لینک فایل تست ترجمه">
    <button data-type="translate">ذخیره</button>
  </div>

  <div class="card">
    <h2>🧹 تست کلین</h2>
    <input id="clean" placeholder="لینک فایل تست کلین">
    <button data-type="clean">ذخیره</button>
  </div>

  <div class="card">
    <h2>✍️ تست تایپ</h2>
    <input id="type" placeholder="لینک فایل تست تایپ">
    <button data-type="type">ذخیره</button>
  </div>

</div>

<script>
  const messageEl = document.getElementById("message");

  function showMessage(text) {
    messageEl.textContent = text;
    setTimeout(() => { messageEl.textContent = ""; }, 3000);
  }

  async function checkAuth() {
    try {
      const res = await fetch("/api/check-auth", { credentials: "include" });
      const data = await res.json();
      if (!data.authenticated) window.location.href = "/admin.html";
    } catch {
      window.location.href = "/admin.html";
    }
  }

  async function loadFiles() {
    try {
      const res = await fetch("/api/test-files", { credentials: "include" });
      const data = await res.json();
      if (!data.success) return;

      ["translate", "clean", "type"].forEach(t => {
        document.getElementById(t).value = data.files[t] || "";
      });

    } catch {
      showMessage("ارتباط با سرور برقرار نشد.");
    }
  }

  document.querySelectorAll("button[data-type]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const type = btn.dataset.type;
      const file_url = document.getElementById(type).value.trim();

      btn.disabled = true;

      try {
        const res = await fetch("/api/test-files", {
          method: "PUT",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ type, file_url })
        });
        const data = await res.json();

        if (data.success) {
          showMessage("ذخیره شد ✅");
        } else {
          showMessage(data.message || "خطا.");
        }
      } catch {
        showMessage("ارتباط با سرور برقرار نشد.");
      }

      btn.disabled = false;
    });
  });

  checkAuth();
  loadFiles();
</script>

</body>
</html>
