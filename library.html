<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>کتابخانه | Manhwa Rose</title>

  <style>
    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    body{
      margin:0;
      background:
        radial-gradient(circle at 20% 10%,rgba(255,50,130,.15),transparent 30%),
        radial-gradient(circle at 80% 80%,rgba(130,50,255,.12),transparent 30%),
        #09070d;
      color:#fff;
      font-family:Tahoma,Arial,sans-serif;
      min-height:100vh;
    }

    .container{
      width:100%;
      max-width:520px;
      margin:auto;
      padding:18px 14px 40px;
    }

    .top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:18px;
    }

    .back{
      color:#fff;
      text-decoration:none;
      background:rgba(255,255,255,.07);
      border:1px solid rgba(255,255,255,.1);
      padding:10px 14px;
      border-radius:14px;
    }

    .title{
      text-align:center;
      flex:1;
      margin:0 10px;
    }

    .title h1{
      margin:0;
      font-size:23px;
      color:#ff5c9d;
    }

    .title p{
      margin:4px 0 0;
      color:#aaa;
      font-size:11px;
    }

    .search{
      width:100%;
      padding:14px 16px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.1);
      background:rgba(255,255,255,.06);
      color:white;
      outline:none;
      font-size:14px;
      margin-bottom:12px;
    }

    .search::placeholder{
      color:#888;
    }

    .filters{
      display:flex;
      gap:8px;
      overflow-x:auto;
      padding-bottom:5px;
      margin-bottom:18px;
    }

    .filter{
      flex:none;
      border:1px solid rgba(255,255,255,.1);
      background:rgba(255,255,255,.06);
      color:#ddd;
      padding:9px 14px;
      border-radius:13px;
      cursor:pointer;
    }

    .filter.active{
      background:linear-gradient(135deg,#ff347e,#a52cff);
      color:#fff;
      border-color:transparent;
    }

    #status{
      text-align:center;
      color:#aaa;
      padding:30px 10px;
      font-size:14px;
    }

    .error{
      background:rgba(255,50,90,.08);
      border:1px solid rgba(255,70,100,.25);
      border-radius:18px;
      padding:20px;
      text-align:center;
      color:#ff9ab8;
      line-height:1.9;
    }

    .retry{
      margin-top:14px;
      border:0;
      background:linear-gradient(135deg,#ff347e,#a52cff);
      color:white;
      padding:11px 20px;
      border-radius:13px;
      font-weight:bold;
      cursor:pointer;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:12px;
    }

    .card{
      background:rgba(255,255,255,.055);
      border:1px solid rgba(255,255,255,.09);
      border-radius:18px;
      overflow:hidden;
      text-decoration:none;
      color:white;
      transition:.2s;
      display:block;
    }

    .card:active{
      transform:scale(.97);
    }

    .cover{
      width:100%;
      aspect-ratio:3/4;
      background:#15121b;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    .cover img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .no-cover{
      color:#777;
      font-size:13px;
    }

    .info{
      padding:11px;
    }

    .name{
      font-size:14px;
      font-weight:bold;
      margin-bottom:8px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .meta{
      display:flex;
      justify-content:space-between;
      gap:5px;
      font-size:10px;
      color:#aaa;
    }

    .genre{
      color:#ff72aa;
    }

    .empty{
      text-align:center;
      color:#888;
      padding:40px 10px;
    }

    @media(max-width:360px){
      .grid{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="top">
    <a class="back" href="index.html">← بازگشت</a>

    <div class="title">
      <h1>🌹 کتابخانه</h1>
      <p>MANHWA ROSE</p>
    </div>

    <div style="width:70px"></div>
  </div>

  <input
    id="search"
    class="search"
    type="text"
    placeholder="🔎 جستجوی مانهوا..."
    autocomplete="off"
  >

  <div class="filters">
    <button class="filter active" data-genre="">همه</button>
    <button class="filter" data-genre="اکشن">رز آبی</button>
    <button class="filter" data-genre="عاشقانه">رز زرد</button>
    <button class="filter" data-genre="فانتزی">فانتزی</button>
    <button class="filter" data-genre="درام">درام</button>
    <button class="filter" data-genre="کمدی">کمدی</button>
  </div>

  <div id="status">در حال دریافت مانهواها...</div>

  <div id="grid" class="grid"></div>

</div>

<script>
  const API = "https://manhwa-rose.wsalqlyzadh0.workers.dev";

  const grid = document.getElementById("grid");
  const statusBox = document.getElementById("status");
  const searchInput = document.getElementById("search");
  const filters = document.querySelectorAll(".filter");

  let mangas = [];
  let selectedGenre = "";

  async function loadManga(){

    statusBox.style.display = "block";
    statusBox.innerHTML = "در حال دریافت مانهواها...";
    grid.innerHTML = "";

    try{

      const response = await fetch(
        API + "/api/public/manga",
        {
          method:"GET",
          headers:{
            "Accept":"application/json"
          },
          cache:"no-store"
        }
      );

      if(!response.ok){
        throw new Error("HTTP " + response.status);
      }

      const data = await response.json();

      console.log("MANHWA API:", data);

      if(!data || data.success !== true){
        throw new Error(
          data && data.error
            ? data.error
            : "پاسخ نامعتبر از سرور"
        );
      }

      mangas = Array.isArray(data.manga)
        ? data.manga
        : Array.isArray(data.results)
          ? data.results
          : [];

      statusBox.style.display = "none";

      render();

    }catch(error){

      console.error("MANHWA ERROR:",error);

      statusBox.innerHTML = `
        <div class="error">
          <div style="font-size:28px;margin-bottom:8px">⚠️</div>
          ارتباط با سرور برقرار نشد.
          <br>
          <small>${escapeHtml(error.message || "Unknown error")}</small>
          <br>
          <button class="retry" onclick="loadManga()">
            تلاش دوباره
          </button>
        </div>
      `;
    }
  }

  function render(){

    const search =
      searchInput.value
        .trim()
        .toLowerCase();

    const filtered = mangas.filter(manga => {

      const title =
        String(manga.title || "").toLowerCase();

      const genre =
        String(manga.genre || "");

      const matchesSearch =
        !search ||
        title.includes(search);

      const matchesGenre =
        !selectedGenre ||
        genre === selectedGenre;

      return matchesSearch && matchesGenre;
    });

    grid.innerHTML = "";

    if(filtered.length === 0){

      grid.innerHTML = `
        <div class="empty" style="grid-column:1/-1">
          🌹 مانهوا‌ای پیدا نشد
        </div>
      `;

      return;
    }

    filtered.forEach(manga => {

      const card = document.createElement("a");

      card.className = "card";

      card.href =
        "view.html?id=" +
        encodeURIComponent(manga.id);

      const coverUrl =
        getFirstImage(manga.cover_url);

      const status =
        manga.status === "completed"
          ? "کامل"
          : "در حال انتشار";

      card.innerHTML = `

        <div class="cover">

          ${
            coverUrl
              ? `
                <img
                  src="${escapeAttribute(coverUrl)}"
                  alt="${escapeAttribute(manga.title || "")}"
                  loading="lazy"
                  onerror="this.style.display='none';this.parentElement.innerHTML='<span class=&quot;no-cover&quot;>بدون تصویر</span>'"
                >
              `
              : `
                <span class="no-cover">
                  بدون تصویر
                </span>
              `
          }

        </div>

        <div class="info">

          <div class="name">
            ${escapeHtml(manga.title || "بدون عنوان")}
          </div>

          <div class="meta">

            <span class="genre">
              ${escapeHtml(manga.genre || "نامشخص")}
            </span>

            <span>
              ${status}
            </span>

          </div>

        </div>
      `;

      grid.appendChild(card);
    });
  }

  function getFirstImage(value){

    if(!value){
      return "";
    }

    /*
      اگر چند لینک داخل cover_url ذخیره شده باشد،
      فقط اولین لینک به عنوان کاور استفاده می‌شود.
    */

    const text = String(value).trim();

    const match = text.match(
      /https?:\/\/[^\s]+/i
    );

    return match ? match[0] : "";
  }

  function escapeHtml(value){

    return String(value)
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");
  }

  function escapeAttribute(value){

    return escapeHtml(value);
  }

  searchInput.addEventListener(
    "input",
    render
  );

  filters.forEach(button => {

    button.addEventListener(
      "click",
      () => {

        filters.forEach(
          b => b.classList.remove("active")
        );

        button.classList.add("active");

        selectedGenre =
          button.dataset.genre || "";

        render();
      }
    );

  });

  /*
    اگر لینک به شکل:
    library.html?genre=عاشقانه
    باز شده باشد، فیلتر مربوطه فعال می‌شود.
  */

  const params =
    new URLSearchParams(
      window.location.search
    );

  const urlGenre =
    params.get("genre");

  if(urlGenre){

    selectedGenre = urlGenre;

    filters.forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.genre === urlGenre
      );

    });
  }

  loadManga();
</script>

</body>
</html>
