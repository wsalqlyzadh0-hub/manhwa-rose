<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مانهوا - Manhwa Rose</title>

<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: Tahoma, Arial, sans-serif;
    background: radial-gradient(circle at top, #6b1f42, #1a0a17 45%, #08050a);
    color: white;
    padding: 20px 16px 60px;
  }

  .wrap {
    max-width: 520px;
    margin: 0 auto;
  }

  .topbar {
    margin-bottom: 18px;
  }

  .topbar a {
    color: #ffb3c9;
    text-decoration: none;
    font-size: 14px;
  }

  .header-card {
    display: flex;
    gap: 16px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 20px;
  }

  .cover {
    width: 110px;
    height: 150px;
    flex-shrink: 0;
    border-radius: 14px;
    background: linear-gradient(135deg, #4a2040, #2a1428);
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    overflow: hidden;
  }

  .head-info {
    flex: 1;
    min-width: 0;
  }

  .head-info h1 {
    font-size: 19px;
    margin: 0 0 6px;
  }

  .head-info .genre {
    font-size: 12px;
    color: #e8b8c8;
    margin-bottom: 6px;
  }

  .status-badge {
    display: inline-block;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 999px;
    background: rgba(226,73,122,0.25);
    border: 1px solid rgba(226,73,122,0.4);
  }

  .description {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 14px 16px;
    font-size: 13px;
    line-height: 1.9;
    color: #e8d4dc;
    margin-bottom: 22px;
  }

  h2 {
    font-size: 17px;
    margin: 0 0 12px;
    color: #ffd1de;
  }

  .chapter-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    border-radius: 14px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    margin-bottom: 10px;
    text-decoration: none;
    color: white;
    transition: transform .15s ease, background .15s ease;
  }

  .chapter-item:active {
    transform: scale(.98);
    background: rgba(255,255,255,0.09);
  }

  .chapter-item .num {
    font-weight: bold;
    font-size: 14px;
  }

  .chapter-item .title {
    font-size: 12px;
    color: #c9a5b6;
    margin-top: 2px;
  }

  .chapter-item .arrow {
    opacity: 0.6;
  }

  .quick-nav {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
  }

  .quick-btn {
    flex: 1;
    text-align: center;
    padding: 13px;
    border-radius: 14px;
    text-decoration: none;
    color: white;
    font-size: 13px;
    font-weight: bold;
  }

  .quick-btn.first {
    background: linear-gradient(135deg, #9d4a8f, #6e2f6b);
  }

  .quick-btn.last {
    background: linear-gradient(135deg, #e2497a, #b13564);
  }

  #empty,
  #loading {
    text-align: center;
    color: #b98ba0;
    padding: 30px;
    font-size: 14px;
  }

  #loading {
    animation: pulse 1.3s infinite;
  }

  @keyframes pulse {
    0%,100% {
      opacity: .45;
    }
    50% {
      opacity: 1;
    }
  }

  #error {
    display: none;
    text-align: center;
    color: #ffb3c9;
    padding: 40px 20px;
    font-size: 14px;
  }

  #errorDetails {
    margin-top: 10px;
    color: #b98ba0;
    font-size: 11px;
    line-height: 1.8;
    direction: ltr;
    word-break: break-word;
  }

  .retry {
    margin-top: 14px;
    padding: 10px 18px;
    border: 0;
    border-radius: 12px;
    background: #d6336c;
    color: white;
    font-family: inherit;
    cursor: pointer;
  }
</style>
</head>

<body>

<div class="wrap">

  <div class="topbar">
    <a href="library.html">← بازگشت به کتابخانه</a>
  </div>

  <div id="loading">
    در حال بارگذاری...
  </div>

  <div id="error">

    <div id="errorText">
      ارتباط با سرور برقرار نشد.
    </div>

    <div id="errorDetails"></div>

    <button class="retry" onclick="load()">
      تلاش دوباره
    </button>

  </div>

  <div id="content" style="display:none;">

    <div class="header-card">

      <div class="cover" id="cover">
        📖
      </div>

      <div class="head-info">

        <h1 id="title"></h1>

        <div class="genre" id="genre"></div>

        <span class="status-badge" id="status"></span>

      </div>

    </div>

    <div class="description" id="description"></div>

    <h2>
      📖 قسمت‌ها
    </h2>

    <div
      class="quick-nav"
      id="quickNav"
      style="display:none;"
    >

      <a
        class="quick-btn first"
        id="firstBtn"
      >
        ⏮ اولین قسمت
      </a>

      <a
        class="quick-btn last"
        id="lastBtn"
      >
        آخرین قسمت ⏭
      </a>

    </div>

    <div id="chapters"></div>

    <div
      id="empty"
      style="display:none;"
    >
      هنوز قسمتی برای این مانهوا اضافه نشده 🌸
    </div>

  </div>

</div>

<script>

const API =
  "https://manhwa-rose.wsalqlyzadh0.workers.dev";

const params =
  new URLSearchParams(window.location.search);

const mangaId =
  params.get("id");

const loading =
  document.getElementById("loading");

const content =
  document.getElementById("content");

const error =
  document.getElementById("error");

const errorText =
  document.getElementById("errorText");

const errorDetails =
  document.getElementById("errorDetails");

const emptyEl =
  document.getElementById("empty");

const chaptersEl =
  document.getElementById("chapters");

const quickNav =
  document.getElementById("quickNav");


function showError(message, details = "") {

  loading.style.display = "none";
  content.style.display = "none";

  errorText.textContent = message;
  errorDetails.textContent = details;

  error.style.display = "block";
}


async function fetchWithTimeout(url, options = {}, timeout = 10000) {

  const controller =
    new AbortController();

  const timer =
    setTimeout(() => {
      controller.abort();
    }, timeout);

  try {

    const response =
      await fetch(
        url,
        {
          ...options,
          signal: controller.signal,
          credentials: "omit"
        }
      );

    return response;

  } finally {

    clearTimeout(timer);

  }
}


async function load() {

  error.style.display = "none";
  errorDetails.textContent = "";

  content.style.display = "none";

  loading.style.display = "block";


  if (!mangaId) {

    showError(
      "مانهوا مشخص نشده.",
      "شناسه مانهوا در آدرس صفحه وجود ندارد."
    );

    return;
  }


  const url =
    API +
    "/api/public/manga/" +
    encodeURIComponent(mangaId);


  try {

    const res =
      await fetchWithTimeout(
        url,
        {
          method: "GET",
          headers: {
            "Accept": "application/json"
          },
          cache: "no-store"
        },
        10000
      );


    if (!res.ok) {

      throw new Error(
        "HTTP " + res.status
      );

    }


    const data =
      await res.json();


    if (!data || !data.success) {

      showError(
        data?.message ||
        data?.error ||
        "مانهوا پیدا نشد."
      );

      return;
    }


    const m =
      data.manga || {};


    document.getElementById("title")
      .textContent =
      m.title || "بدون عنوان";


    document.getElementById("genre")
      .textContent =
      m.genre || "";


    document.getElementById("status")
      .textContent =
      m.status === "completed"
        ? "تمام‌شده"
        : "در حال انتشار";


    document.getElementById("description")
      .textContent =
      m.description ||
      "توضیحاتی ثبت نشده.";


    /*
      Cover
      اگر چند لینک با فاصله ذخیره شده باشد،
      اولین لینک استفاده می‌شود.
    */

    if (m.cover_url) {

      const coverEl =
        document.getElementById("cover");

      const firstCover =
        String(m.cover_url)
          .trim()
          .split(/\s+/)[0];

      if (firstCover) {

        coverEl.style.backgroundImage =
          `url("${firstCover.replace(/"/g, '\\"')}")`;

        coverEl.textContent = "";

      }

    }


    chaptersEl.innerHTML = "";


    const chapters =
      Array.isArray(data.chapters)
        ? data.chapters
        : [];


    if (chapters.length === 0) {

      emptyEl.style.display = "block";
      quickNav.style.display = "none";

    } else {

      emptyEl.style.display = "none";
      quickNav.style.display = "flex";


      const firstCh =
        chapters[0];

      const lastCh =
        chapters[chapters.length - 1];


      document.getElementById("firstBtn")
        .href =
        "read.html?id=" +
        encodeURIComponent(firstCh.id);


      document.getElementById("lastBtn")
        .href =
        "read.html?id=" +
        encodeURIComponent(lastCh.id);


      chapters.forEach(ch => {

        const a =
          document.createElement("a");

        a.className =
          "chapter-item";


        a.href =
          "read.html?id=" +
          encodeURIComponent(ch.id);


        const number =
          ch.chapter_number ?? "";


        const title =
          ch.title || "";


        const left =
          document.createElement("div");


        const numberEl =
          document.createElement("div");

        numberEl.className =
          "num";

        numberEl.textContent =
          "قسمت " + number;


        left.appendChild(numberEl);


        if (title) {

          const titleEl =
            document.createElement("div");

          titleEl.className =
            "title";

          titleEl.textContent =
            title;

          left.appendChild(titleEl);

        }


        const arrow =
          document.createElement("div");

        arrow.className =
          "arrow";

        arrow.textContent =
          "◀";


        a.appendChild(left);
        a.appendChild(arrow);

        chaptersEl.appendChild(a);

      });

    }


    loading.style.display = "none";
    content.style.display = "block";


  } catch (err) {

    console.error(
      "Manga details error:",
      err
    );


    if (
      err &&
      err.name === "AbortError"
    ) {

      showError(
        "پاسخ سرور دیر دریافت شد.",
        "درخواست بعد از ۱۰ ثانیه متوقف شد.\n" +
        url
      );

    } else {

      showError(
        "ارتباط با سرور برقرار نشد.",
        err?.message || String(err)
      );

    }

  }

}


load();

</script>

</body>
</html>
