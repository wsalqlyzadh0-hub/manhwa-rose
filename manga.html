<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدیریت مانهوا - Manhwa Rose 🌹</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: Tahoma, Arial, sans-serif;
    background:
      radial-gradient(circle at top, #6b1f42, #1a0a17 45%, #08050a);
    color: white;
    padding: 20px 14px 60px;
  }

  .wrap {
    max-width: 480px;
    margin: 0 auto;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .topbar a {
    color: #ffb3c9;
    text-decoration: none;
    font-size: 14px;
  }

  .topbar a:hover {
    color: white;
  }

  h1 {
    font-size: 24px;
    text-align: center;
    margin: 0 0 20px;
    background: linear-gradient(
      90deg,
      #ffd1de,
      #ff8fae,
      #ffd1de
    );
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .card {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.13);
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 16px;
    backdrop-filter: blur(12px);
  }

  input,
  textarea,
  select {
    width: 100%;
    padding: 12px;
    margin-bottom: 10px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(0,0,0,0.3);
    color: white;
    font-size: 14px;
    font-family: inherit;
    outline: none;
  }

  input:focus,
  textarea:focus,
  select:focus {
    border-color: #ff6f9c;
    box-shadow: 0 0 0 2px rgba(255,111,156,0.12);
  }

  select option {
    background: #24101d;
    color: white;
  }

  textarea {
    resize: vertical;
    min-height: 70px;
  }

  button {
    border: none;
    border-radius: 10px;
    padding: 12px 16px;
    font-weight: bold;
    cursor: pointer;
    font-size: 14px;
    color: white;
    transition:
      transform .15s ease,
      filter .15s ease,
      opacity .15s ease;
    font-family: inherit;
  }

  button:active {
    transform: scale(.97);
  }

  button:disabled {
    opacity: .55;
    cursor: wait;
  }

  .btn-save {
    width: 100%;
    background: linear-gradient(
      135deg,
      #e2497a,
      #b13564
    );
    box-shadow:
      0 8px 25px rgba(226,73,122,.18);
  }

  .btn-save:hover {
    filter: brightness(1.1);
  }

  .manga-item {
    display: flex;
    gap: 12px;
    align-items: center;
    padding: 12px;
    border-radius: 14px;
    background: rgba(255,255,255,0.05);
    margin-bottom: 10px;
    border: 1px solid rgba(255,255,255,0.08);
  }

  .manga-item img {
    width: 52px;
    height: 68px;
    object-fit: cover;
    border-radius: 8px;
    background: rgba(255,255,255,0.1);
    flex-shrink: 0;
  }

  .manga-info {
    flex: 1;
    min-width: 0;
  }

  .manga-info .title {
    font-weight: bold;
    font-size: 15px;
    margin-bottom: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .manga-info .meta {
    font-size: 12px;
    color: #d8a8bb;
  }

  .manga-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }

  .manga-actions button {
    padding: 8px 10px;
    font-size: 13px;
  }

  .btn-edit {
    background: #4a2a55;
  }

  .btn-edit:hover {
    filter: brightness(1.15);
  }

  .btn-delete {
    background: #7a2a3a;
  }

  .btn-delete:hover {
    filter: brightness(1.15);
  }

  #message {
    text-align: center;
    min-height: 20px;
    margin-bottom: 10px;
    color: #ff8fae;
    font-size: 13px;
  }

  #empty {
    text-align: center;
    color: #b98ba0;
    font-size: 14px;
    padding: 20px;
  }

  #loading {
    text-align: center;
    color: #d8a8bb;
    padding: 20px;
    font-size: 14px;
  }

  label {
    font-size: 12px;
    color: #e8b8c8;
    display: block;
    margin-bottom: 4px;
  }

  .edit-badge {
    display: none;
    background: rgba(226,73,122,.15);
    border: 1px solid rgba(226,73,122,.3);
    color: #ff9fba;
    border-radius: 10px;
    padding: 8px 10px;
    margin-bottom: 12px;
    font-size: 12px;
    text-align: center;
  }

  .cancel-edit {
    width: 100%;
    margin-top: 8px;
    background: rgba(255,255,255,.08);
    display: none;
  }

  .server-error {
    color: #ff7f9f;
    text-align: center;
    font-size: 13px;
    padding: 12px;
  }
</style>
</head>

<body>

<div class="wrap">

  <div class="topbar">
    <a href="admin.html">← بازگشت به پنل</a>
    <span>🌹</span>
  </div>

  <h1>📚 مدیریت مانهوا</h1>

  <div id="message"></div>

  <div class="card" id="formCard">

    <input type="hidden" id="editId">

    <div class="edit-badge" id="editBadge">
      ✏️ در حال ویرایش مانهوا
    </div>

    <label for="title">عنوان</label>
    <input
      id="title"
      type="text"
      placeholder="اسم مانهوا"
      autocomplete="off"
    >

    <label for="description">توضیحات</label>
    <textarea
      id="description"
      placeholder="خلاصه داستان..."
    ></textarea>

    <label for="cover_url">لینک عکس کاور</label>
    <input
      id="cover_url"
      type="text"
      placeholder="https://..."
      autocomplete="off"
    >

    <label for="genre">دسته‌بندی</label>
    <select id="genre">
      <option value="اکشن">🔵 اکشن (رز آبی)</option>
      <option value="عاشقانه">🟡 عاشقانه (رز زرد)</option>
      <option value="فانتزی">فانتزی</option>
      <option value="درام">درام</option>
      <option value="کمدی">کمدی</option>
      <option value="ماجراجویی">ماجراجویی</option>
      <option value="ترسناک">ترسناک</option>
    </select>

    <label for="status">وضعیت</label>
    <select id="status">
      <option value="ongoing">در حال انتشار</option>
      <option value="completed">تمام‌شده</option>
    </select>

    <button class="btn-save" id="saveBtn">
      ➕ افزودن مانهوا
    </button>

    <button class="cancel-edit" id="cancelEditBtn">
      ✖️ لغو ویرایش
    </button>

  </div>

  <div id="loading">
    در حال بارگذاری مانهوا...
  </div>

  <div id="list"></div>

  <div id="empty" style="display:none;">
    هنوز مانهوایی اضافه نکردی 🌸
  </div>

</div>

<script>

  // ==========================================================
  // CLOUDFLARE WORKER API
  // ==========================================================

  const API =
    "https://manhwa-rose.wsalqlyzadh0.workers.dev";


  // ==========================================================
  // ELEMENTS
  // ==========================================================

  const listEl =
    document.getElementById("list");

  const emptyEl =
    document.getElementById("empty");

  const loadingEl =
    document.getElementById("loading");

  const messageEl =
    document.getElementById("message");

  const saveBtn =
    document.getElementById("saveBtn");

  const cancelEditBtn =
    document.getElementById("cancelEditBtn");

  const editBadge =
    document.getElementById("editBadge");

  const editIdEl =
    document.getElementById("editId");


  const fields = [
    "title",
    "description",
    "cover_url",
    "genre",
    "status"
  ];


  // ==========================================================
  // MESSAGE
  // ==========================================================

  let messageTimer = null;

  function showMessage(text) {

    clearTimeout(messageTimer);

    messageEl.textContent = text;

    messageTimer = setTimeout(() => {
      messageEl.textContent = "";
    }, 3500);
  }


  // ==========================================================
  // RESET FORM
  // ==========================================================

  function resetForm() {

    editIdEl.value = "";

    document.getElementById("title").value = "";
    document.getElementById("description").value = "";
    document.getElementById("cover_url").value = "";

    document.getElementById("genre").value = "اکشن";
    document.getElementById("status").value = "ongoing";

    saveBtn.textContent =
      "➕ افزودن مانهوا";

    cancelEditBtn.style.display =
      "none";

    editBadge.style.display =
      "none";
  }


  // ==========================================================
  // AUTH CHECK
  // ==========================================================

  async function checkAuth() {

    try {

      const res = await fetch(
        API + "/api/check-auth",
        {
          method: "GET",
          credentials: "include",
          cache: "no-store"
        }
      );

      if (!res.ok) {
        throw new Error(
          "Auth request failed"
        );
      }

      const data =
        await res.json();

      if (!data.authenticated) {

        window.location.href =
          "admin.html";

        return false;
      }

      return true;

    } catch (error) {

      console.error(
        "Auth error:",
        error
      );

      showMessage(
        "ارتباط با سرور برقرار نشد."
      );

      return false;
    }
  }


  // ==========================================================
  // LOAD MANGA
  // ==========================================================

  async function loadManga() {

    loadingEl.style.display =
      "block";

    listEl.innerHTML = "";

    emptyEl.style.display =
      "none";

    try {

      const res = await fetch(
        API + "/api/manga",
        {
          method: "GET",
          credentials: "include",
          cache: "no-store"
        }
      );

      const data =
        await res.json();

      if (res.status === 401) {

        window.location.href =
          "admin.html";

        return;
      }

      if (!res.ok || !data.success) {

        showMessage(
          data.error ||
          data.message ||
          "خطا در بارگذاری مانهوا."
        );

        return;
      }

      const manga =
        Array.isArray(data.manga)
          ? data.manga
          : Array.isArray(data.results)
            ? data.results
            : [];

      listEl.innerHTML = "";

      if (manga.length === 0) {

        emptyEl.style.display =
          "block";

        return;
      }

      emptyEl.style.display =
        "none";


      manga.forEach(m => {

        const item =
          document.createElement("div");

        item.className =
          "manga-item";


        const image =
          document.createElement("img");

        image.src =
          getFirstImage(
            m.cover_url
          );

        image.alt =
          m.title || "Manga";

        image.onerror = function() {
          this.style.display = "none";
        };


        const info =
          document.createElement("div");

        info.className =
          "manga-info";


        const title =
          document.createElement("div");

        title.className =
          "title";

        title.textContent =
          m.title || "بدون عنوان";


        const meta =
          document.createElement("div");

        meta.className =
          "meta";

        meta.textContent =
          `${m.genre || "بدون ژانر"} · ${
            m.status === "completed"
              ? "تمام‌شده"
              : "در حال انتشار"
          }`;


        info.appendChild(title);
        info.appendChild(meta);


        const actions =
          document.createElement("div");

        actions.className =
          "manga-actions";


        const editButton =
          document.createElement("button");

        editButton.className =
          "btn-edit";

        editButton.textContent =
          "✏️";

        editButton.title =
          "ویرایش";


        editButton.addEventListener(
          "click",
          () => editManga(m)
        );


        const deleteButton =
          document.createElement("button");

        deleteButton.className =
          "btn-delete";

        deleteButton.textContent =
          "🗑️";

        deleteButton.title =
          "حذف";


        deleteButton.addEventListener(
          "click",
          () =>
            deleteManga(
              m.id,
              m.title
            )
        );


        actions.appendChild(
          editButton
        );

        actions.appendChild(
          deleteButton
        );


        item.appendChild(image);
        item.appendChild(info);
        item.appendChild(actions);


        listEl.appendChild(item);

      });

    } catch (error) {

      console.error(
        "Load manga error:",
        error
      );

      showMessage(
        "ارتباط با سرور برقرار نشد."
      );

    } finally {

      loadingEl.style.display =
        "none";
    }
  }


  // ==========================================================
  // GET FIRST IMAGE
  // ==========================================================

  function getFirstImage(value) {

    if (!value) {
      return "";
    }

    return String(value)
      .trim()
      .split(/\s+/)[0] || "";
  }


  // ==========================================================
  // EDIT MANGA
  // ==========================================================

  function editManga(m) {

    editIdEl.value =
      m.id;

    document.getElementById("title").value =
      m.title || "";

    document.getElementById("description").value =
      m.description || "";

    document.getElementById("cover_url").value =
      m.cover_url || "";

    document.getElementById("genre").value =
      m.genre || "اکشن";

    document.getElementById("status").value =
      m.status || "ongoing";


    saveBtn.textContent =
      "💾 ذخیره تغییرات";

    cancelEditBtn.style.display =
      "block";

    editBadge.style.display =
      "block";


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }


  // ==========================================================
  // DELETE MANGA
  // ==========================================================

  async function deleteManga(
    id,
    title
  ) {

    const confirmed =
      confirm(
        `مطمئنی می‌خوای "${title}" رو حذف کنی؟ قسمت‌هاش هم پاک میشن.`
      );

    if (!confirmed) {
      return;
    }


    try {

      const res = await fetch(
        API +
        "/api/manga/" +
        encodeURIComponent(id),
        {
          method: "DELETE",
          credentials: "include"
        }
      );


      const data =
        await res.json();


      if (res.status === 401) {

        window.location.href =
          "admin.html";

        return;
      }


      if (data.success) {

        showMessage(
          "مانهوا حذف شد ✅"
        );

        await loadManga();

      } else {

        showMessage(
          data.error ||
          data.message ||
          "خطا در حذف."
        );
      }

    } catch (error) {

      console.error(
        "Delete error:",
        error
      );

      showMessage(
        "ارتباط با سرور برقرار نشد."
      );
    }
  }


  // ==========================================================
  // SAVE / CREATE / UPDATE
  // ==========================================================

  saveBtn.addEventListener(
    "click",
    async () => {

      const title =
        document
          .getElementById("title")
          .value
          .trim();


      if (!title) {

        showMessage(
          "عنوان الزامی است."
        );

        return;
      }


      const body = {

        title,

        description:
          document
            .getElementById(
              "description"
            )
            .value,

        cover_url:
          document
            .getElementById(
              "cover_url"
            )
            .value
            .trim(),

        genre:
          document
            .getElementById(
              "genre"
            )
            .value,

        status:
          document
            .getElementById(
              "status"
            )
            .value
      };


      const id =
        editIdEl.value;


      const url =
        id
          ? API +
            "/api/manga/" +
            encodeURIComponent(id)
          : API +
            "/api/manga";


      const method =
        id
          ? "PUT"
          : "POST";


      saveBtn.disabled =
        true;


      saveBtn.textContent =
        id
          ? "در حال ذخیره..."
          : "در حال افزودن...";


      try {

        const res =
          await fetch(
            url,
            {
              method,

              credentials:
                "include",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify(body)
            }
          );


        const data =
          await res.json();


        if (res.status === 401) {

          window.location.href =
            "admin.html";

          return;
        }


        if (data.success) {

          showMessage(
            id
              ? "تغییرات ذخیره شد ✅"
              : "مانهوا اضافه شد ✅"
          );


          resetForm();

          await loadManga();

        } else {

          showMessage(
            data.error ||
            data.message ||
            "خطا در ذخیره اطلاعات."
          );

        }

      } catch (error) {

        console.error(
          "Save error:",
          error
        );

        showMessage(
          "ارتباط با سرور برقرار نشد."
        );

      } finally {

        saveBtn.disabled =
          false;

        if (editIdEl.value) {

          saveBtn.textContent =
            "💾 ذخیره تغییرات";

        } else {

          saveBtn.textContent =
            "➕ افزودن مانهوا";
        }
      }

    }
  );


  // ==========================================================
  // CANCEL EDIT
  // ==========================================================

  cancelEditBtn.addEventListener(
    "click",
    () => {

      resetForm();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }
  );


  // ==========================================================
  // START
  // ==========================================================

  async function start() {

    const authenticated =
      await checkAuth();

    if (!authenticated) {
      return;
    }

    await loadManga();
  }


  start();

</script>

</body>
</html>
